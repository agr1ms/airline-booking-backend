spring.application.name=airline-api

# H2 Database
spring.datasource.url=jdbc:h2:mem:airlinedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console (http://localhost:8080/h2-console — JDBC URL: jdbc:h2:mem:airlinedb)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT (demo secret — change in production)
app.jwt.secret=change-this-secret-key-to-at-least-32-chars-long
app.jwt.expiration-ms=86400000

app.checkin.opens-hours-before=24
app.checkin.closes-hours-before=1
app.baggage.cabin-max-kg=7
app.baggage.checked-max-kg=23
app.baggage.max-checked-bags=3
app.baggage.checked-fee-per-kg=50
